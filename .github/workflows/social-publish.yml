name: Publish social content

on:
  schedule:
    - cron: "0 2,8,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate captions without publishing to Facebook"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and publish social posts
        env:
          SOCIAL_AUTOPUBLISH_ENABLED: ${{ vars.SOCIAL_AUTOPUBLISH_ENABLED || 'false' }}
          SOCIAL_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SOCIAL_POSTS_PER_DAY: 3
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SOCIAL_MODEL: ${{ vars.OPENAI_SOCIAL_MODEL || 'gpt-4o-mini' }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v24.0' }}
          META_PAGE_ID_ANISTREAMING: ${{ secrets.META_PAGE_ID_ANISTREAMING }}
          META_PAGE_ACCESS_TOKEN_ANISTREAMING: ${{ secrets.META_PAGE_ACCESS_TOKEN_ANISTREAMING }}
          META_PAGE_ID_FILMANESIA: ${{ secrets.META_PAGE_ID_FILMANESIA }}
          META_PAGE_ACCESS_TOKEN_FILMANESIA: ${{ secrets.META_PAGE_ACCESS_TOKEN_FILMANESIA }}
        run: node scripts/social-publisher.mjs

      - name: Save published-post state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-posted.json
          git diff --cached --quiet || git commit -m "chore: record social publishing state"
          git push
